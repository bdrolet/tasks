# config/prioritize.toml — every tunable of the "do next" scorer.
# Design: docs/superpowers/specs/2026-09-23-next-prioritizer-design.md

[capacity]
points_per_day = 5
default_points = 3            # unpointed AND unenriched tasks
low_confidence_multiplier = 1.5
min_effort_days = 0.25

[weights]                     # cost_of_delay terms; sum to 1.0
priority = 0.20               # each of the six is the pre-strategy value × 0.8; flag mode divides back
urgency = 0.24
impact = 0.12
unblock = 0.08
aging = 0.04
category = 0.12
necessity = 0.20

[priority]
P0 = 1.0
P1 = 0.6
P2 = 0.3
P3 = 0.1
default = "P2"                # a title with no [PX] prefix

[horizon_days]                # soft deadline = created_at + horizon[priority]
P0 = 3
P1 = 14
P2 = 45
P3 = 120

[urgency]                     # U = 1 / (1 + exp(k * (effective_slack - s0)))
k = 1.0
s0 = 3.0
soft_cap_inferred = 0.6       # due date the model read from the text (medium/high confidence)
soft_cap_horizon = 0.4        # due date manufactured from created_at + horizon[priority]
no_due = 0.1

[impact]
low = 0.2
medium = 0.5
high = 1.0

[aging]
stale_days = 30               # A = min(1, days_stale / stale_days)

[unblock]
per_task = 0.3                # B = min(1, per_task * open dependents)

[category]                    # keyed by Asana project name; unknown -> default
default = 0.5
Consulting = 1.0
"Ben's Board" = 0.7

[projects]
excluded = ["Inbox"]          # gathered and stored, never ranked or selected (bucket excluded:project)

[selection]
default_n = 5
diversity_penalty = 0.95      # same-day, per pick in the same project
energy_penalty = 0.7
hard_due_window_days = 1      # hard due_on <= today + N is selected first, beyond n and capacity

[starvation]                  # cross-day fairness: boost a project's tasks the longer it has gone without a daily pick
boost_per_day = 0.1
max_boost = 0.5

[stale]
after_days = 45
deferred_limit = 5

[necessity]                   # spec D6
mode = "flag"                 # flag | demote | suppress
path = 1.0
derisk = 0.9
support = 0.5
unattached = 0.2              # serves empty with low confidence; unenriched; no strategy loaded
below_the_line_boost = 1.15   # cost-of-delay multiplier for a slipping area's path/derisk tasks (evidence signals only)

[strategy]                    # spec D3, D9, D11, D14
stale_after_days = 90         # 'last reviewed' older than this is a review finding
lag_flat_periods = 2          # consecutive unmet lag periods, with leads met, before "lead strong, lag flat"
suppression_settle_days = 30  # a necessity suppression not restored by then counts as agreement
signal_debounce_days = 3      # consecutive raw-true days before a signal flips, and raw-false before it clears
min_tagged_for_signals = 5    # an area with fewer serves:<area> tasks reports no_data for every signal
